<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTG Victory Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #ffffff;
      color: #000000;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    @media (max-width: 768px) {
      body {
        padding: 10px;
      }
    }

    .header {
      padding: 20px;
      border: 1px solid #000;
      margin-bottom: 0;
      text-align: center;
    }

    .header h1 {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 14px;
      color: #666;
    }

    @media (max-width: 768px) {
      .header {
        padding: 15px;
      }
      
      .header h1 {
        font-size: 20px;
      }
    }

    .section {
      border: 1px solid #000;
      border-top: none;
      padding: 30px;
      background: #fff;
    }

    @media (max-width: 768px) {
      .section {
        padding: 20px;
      }
    }

    .global-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    @media (max-width: 768px) {
      .global-stats {
        gap: 15px;
      }
    }

    .stat-card {
      border: 1px solid #000;
      padding: 20px;
      text-align: center;
    }

    .stat-card h2 {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .stat-card .count {
      font-size: 48px;
      font-weight: bold;
      margin: 10px 0;
    }

    @media (max-width: 768px) {
      .stat-card {
        padding: 15px;
      }

      .stat-card .count {
        font-size: 36px;
      }
    }

    .session-info {
      border: 1px solid #000;
      padding: 20px;
      margin-bottom: 20px;
      background: rgba(0, 0, 0, 0.02);
    }

    .session-info h3 {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .session-info p {
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 8px;
    }

    .session-info .highlight {
      font-weight: bold;
      font-size: 16px;
    }

    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 30px;
    }

    @media (max-width: 768px) {
      .button-group {
        grid-template-columns: 1fr;
        gap: 10px;
      }
    }

    button {
      padding: 15px 20px;
      border: 1px solid #000;
      background: #fff;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    button:hover {
      background-color: #000;
      color: #fff;
    }

    button:active {
      transform: scale(0.98);
    }

    button.winner-pol {
      background-color: #f0f0f0;
    }

    button.winner-dome {
      background-color: #f0f0f0;
    }

    .game-log {
      border: 1px solid #000;
      padding: 20px;
      max-height: 400px;
      overflow-y: auto;
      background: #fff;
    }

    .game-log h3 {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    .game-entry {
      padding: 10px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .game-entry:last-child {
      border-bottom: none;
    }

    .game-entry .winner {
      font-weight: bold;
    }

    .game-entry .time {
      color: #666;
      font-size: 12px;
    }

    .empty-state {
      text-align: center;
      color: #666;
      font-style: italic;
      padding: 20px;
    }

    .danger-zone {
      margin-top: 30px;
      padding-top: 30px;
      border-top: 1px solid #000;
    }

    .danger-zone h3 {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 15px;
      text-transform: uppercase;
      color: #666;
    }

    .danger-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    @media (max-width: 768px) {
      .danger-buttons {
        grid-template-columns: 1fr;
        gap: 10px;
      }
    }

    .danger-buttons button {
      background: #fff;
      border-color: #999;
      color: #666;
    }

    .danger-buttons button:hover {
      background: #666;
      border-color: #666;
      color: #fff;
    }

    .no-games {
      text-align: center;
      padding: 40px 20px;
      color: #666;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>MTG Victory Tracker</h1>
    <p>pol vs dome</p>
  </div>

  <div class="section">
    <!-- Global Stats -->
    <div class="global-stats">
      <div class="stat-card">
        <h2>Pol</h2>
        <div class="count" id="pol-total">0</div>
        <p>total victories</p>
      </div>
      <div class="stat-card">
        <h2>Dome</h2>
        <div class="count" id="dome-total">0</div>
        <p>total victories</p>
      </div>
    </div>

    <!-- Session Info -->
    <div class="session-info" id="session-info">
      <h3>Session Status</h3>
      <p id="last-winner-text">No games played yet today</p>
      <p id="next-starter-text"></p>
      <p id="today-winner-text"></p>
    </div>

    <!-- Record Victory Buttons -->
    <div class="button-group">
      <button onclick="recordVictory('Pol')" class="winner-pol">Pol Wins</button>
      <button onclick="recordVictory('Dome')" class="winner-dome">Dome Wins</button>
    </div>

    <!-- Today's Game Log -->
    <div class="game-log">
      <h3>Today's Games</h3>
      <div id="game-log-content" class="empty-state">
        No games recorded today
      </div>
    </div>

    <!-- Danger Zone -->
    <div class="danger-zone">
      <h3>Danger Zone</h3>
      <div class="danger-buttons">
        <button onclick="resetSession()">Reset Today's Session</button>
        <button onclick="clearAll()">Clear All Data</button>
      </div>
    </div>
  </div>

  <script>
    // Storage keys
    const STORAGE_KEYS = {
      POL_TOTAL: 'mtg_pol_total',
      DOME_TOTAL: 'mtg_dome_total',
      TODAY_GAMES: 'mtg_today_games',
      LAST_DATE: 'mtg_last_date'
    };

    // Initialize
    function init() {
      checkNewDay();
      updateDisplay();
    }

    // Check if it's a new day and reset session if needed
    function checkNewDay() {
      const today = new Date().toDateString();
      const lastDate = localStorage.getItem(STORAGE_KEYS.LAST_DATE);
      
      if (lastDate !== today) {
        // New day - reset today's games but keep totals
        localStorage.setItem(STORAGE_KEYS.TODAY_GAMES, JSON.stringify([]));
        localStorage.setItem(STORAGE_KEYS.LAST_DATE, today);
      }
    }

    // Get data from localStorage
    function getData() {
      return {
        polTotal: parseInt(localStorage.getItem(STORAGE_KEYS.POL_TOTAL) || '0'),
        domeTotal: parseInt(localStorage.getItem(STORAGE_KEYS.DOME_TOTAL) || '0'),
        todayGames: JSON.parse(localStorage.getItem(STORAGE_KEYS.TODAY_GAMES) || '[]')
      };
    }

    // Record a victory
    function recordVictory(winner) {
      const data = getData();
      
      // Update total
      if (winner === 'Pol') {
        data.polTotal++;
        localStorage.setItem(STORAGE_KEYS.POL_TOTAL, data.polTotal);
      } else {
        data.domeTotal++;
        localStorage.setItem(STORAGE_KEYS.DOME_TOTAL, data.domeTotal);
      }

      // Add to today's games
      const game = {
        winner: winner,
        timestamp: new Date().toISOString(),
        time: new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })
      };
      data.todayGames.push(game);
      localStorage.setItem(STORAGE_KEYS.TODAY_GAMES, JSON.stringify(data.todayGames));

      updateDisplay();
    }

    // Update the display
    function updateDisplay() {
      const data = getData();

      // Update totals
      document.getElementById('pol-total').textContent = data.polTotal;
      document.getElementById('dome-total').textContent = data.domeTotal;

      // Update session info
      const sessionInfo = document.getElementById('session-info');
      const lastWinnerText = document.getElementById('last-winner-text');
      const nextStarterText = document.getElementById('next-starter-text');
      const todayWinnerText = document.getElementById('today-winner-text');

      if (data.todayGames.length === 0) {
        lastWinnerText.textContent = 'No games played yet today';
        nextStarterText.textContent = '';
        todayWinnerText.textContent = '';
      } else {
        const lastGame = data.todayGames[data.todayGames.length - 1];
        const nextStarter = lastGame.winner === 'Pol' ? 'Dome' : 'Pol';
        
        lastWinnerText.innerHTML = `<span class="highlight">Last game:</span> ${lastGame.winner} won`;
        nextStarterText.innerHTML = `<span class="highlight">Next starter:</span> ${nextStarter}`;

        // Calculate today's winner
        const polWins = data.todayGames.filter(g => g.winner === 'Pol').length;
        const domeWins = data.todayGames.filter(g => g.winner === 'Dome').length;
        
        if (polWins > domeWins) {
          todayWinnerText.innerHTML = `<span class="highlight">Today's leader:</span> Pol (${polWins}-${domeWins})`;
        } else if (domeWins > polWins) {
          todayWinnerText.innerHTML = `<span class="highlight">Today's leader:</span> Dome (${domeWins}-${polWins})`;
        } else {
          todayWinnerText.innerHTML = `<span class="highlight">Today's score:</span> Tied (${polWins}-${domeWins})`;
        }
      }

      // Update game log
      const logContent = document.getElementById('game-log-content');
      if (data.todayGames.length === 0) {
        logContent.className = 'empty-state';
        logContent.textContent = 'No games recorded today';
      } else {
        logContent.className = '';
        logContent.innerHTML = data.todayGames
          .slice()
          .reverse()
          .map((game, index) => `
            <div class="game-entry">
              <span>
                <span class="winner">${game.winner}</span> won
                ${index === 0 ? ' (most recent)' : ''}
              </span>
              <span class="time">${game.time}</span>
            </div>
          `)
          .join('');
      }
    }

    // Reset today's session
    function resetSession() {
      if (confirm('Reset today\'s session? This will clear today\'s games but keep total victories.')) {
        localStorage.setItem(STORAGE_KEYS.TODAY_GAMES, JSON.stringify([]));
        updateDisplay();
      }
    }

    // Clear all data
    function clearAll() {
      if (confirm('Clear ALL data? This will reset everything including total victories. This cannot be undone!')) {
        if (confirm('Are you absolutely sure? This will delete all victory records permanently.')) {
          localStorage.removeItem(STORAGE_KEYS.POL_TOTAL);
          localStorage.removeItem(STORAGE_KEYS.DOME_TOTAL);
          localStorage.removeItem(STORAGE_KEYS.TODAY_GAMES);
          localStorage.removeItem(STORAGE_KEYS.LAST_DATE);
          updateDisplay();
        }
      }
    }

    // Initialize on load
    init();
  </script>
</body>
</html>
